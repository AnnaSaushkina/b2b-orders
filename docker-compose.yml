# Вариант 1 (основной для разработки): в контейнерах только инфраструктура —
# PostgreSQL. API и клиент поднимаются на хосте через `pnpm dev`.
#
# Запуск:
#   docker compose up -d        # поднять инфру в фоне
#   pnpm dev                    # в отдельном терминале — клиент + сервер
#   docker compose down         # остановить (данные сохранятся в volume)

name: marven

services:
  postgres:
    image: postgres:18 # 18 — актуальный релиз; 19 на август-2026 ещё не вышел
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
